- name: pickTopic
  description: Returns topics in the selected model and picks the most relevant topic for the query.
- name: getData
  description: Executes queries against the selected model and topic and returns results.
- name: askOmni
  description: Submits an agentic analysis job to Omni and returns immediately without waiting.
- name: checkStatus
  description: Polls the status of a previously submitted job by jobId.
- name: searchOmniDocs
