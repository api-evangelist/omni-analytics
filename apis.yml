apis:
- name: Omni REST API
  description: >-
    The Omni REST API provides programmatic access to an Omni instance: models,
    topics, views and fields; documents, dashboards and folders; query execution
    and scheduling; users, groups and permissions; connections and dbt; uploads;
    and AI operations. The API base URL mirrors your Omni login URL with /api
    appended (for example https://<instance>.omniapp.co/api) and accepts HTTPS
    only. Authentication is via API key bearer token or OAuth 2.1.
  humanURL: https://docs.omni.co/docs/API
  baseURL: https://omniapp.co/api
