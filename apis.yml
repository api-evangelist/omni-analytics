name: Omni Analytics
description: >-
  Omni is a business intelligence and embedded analytics platform that turns raw
  warehouse data into trusted insights. It combines a central semantic layer with
  an AI chat interface, dashboards, spreadsheets, a point-and-click builder, and a
  SQL IDE, so data teams and business users can query data conversationally and
  then refine results with traditional analytics tools. Omni exposes a REST API,
  a hosted MCP server, a Go CLI, a Python SDK, and a library of published Agent
  Skills for programmatic and agent-driven access, plus white-label embedded
  analytics via SSO. It connects to Snowflake, BigQuery, Databricks, dbt and other
  warehouses, and is backed by GV (Google Ventures). Customers include Condé Nast,
  BuzzFeed, Perplexity, dbt Labs, and TripAdvisor.
